<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <meta charset="UTF-8">
  <title>Messages | Vendor Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/messages.css', v='1.3') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  {% include "partials/header_vendor.html" %}

  <main class="admin-container">
      
      <div class="admin-hero-enhanced">
          <div class="hero-text">
              <h1>Communication Hub</h1>
              <p>Connect with your clients and get support from the admin team.</p>
          </div>
      </div>

       <div class="chat-wrapper">
          
          <div class="chat-list-pane">
              <div class="chat-search">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input type="text" id="contactSearch" placeholder="Search chats...">
              </div>
              
              <div class="chat-tabs" style="display: none;">
                  <button class="tab-btn active">All</button>
                  <button class="tab-btn">Unread</button>
                  <button class="tab-btn">Admin</button>
              </div>

              <div class="contacts-scroll" id="contactsList">
                  <!-- Populated dynamically via JS -->
              </div>
          </div>

          <div class="chat-window-pane" id="chatWindow" style="display: none;">
              
              <div class="chat-header">
                  <div class="chat-partner-info">
                      <img src="{{ url_for('static', filename='images/default_avatar.svg') }}" id="chatHeaderImg" alt="Active User">
                      <div>
                          <h3 id="chatHeaderName">Customer Name</h3>
                          <span id="chatHeaderStatus" class="status-text online">Online</span>
                      </div>
                  </div>
                  <div class="chat-actions" style="display: none;">
                      <button class="icon-btn-plain"><i class="fa-solid fa-phone"></i></button>
                      <button class="icon-btn-plain"><i class="fa-solid fa-video"></i></button>
                      <button class="icon-btn-plain"><i class="fa-solid fa-circle-info"></i></button>
                  </div>
              </div>

              <div class="chat-messages" id="chatMessages">
                  <!-- Populated dynamically via JS -->
              </div>

              <div class="chat-input-area">
                  <button class="attach-btn" style="display: none;"><i class="fa-solid fa-paperclip"></i></button>
                  <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
                  <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
              </div>

          </div>

          <div class="chat-window-pane" id="noChatSelected" style="display: flex; align-items: center; justify-content: center; flex: 1; background: #fafafa; color: #888;">
              <div style="text-align: center; padding: 40px;">
                  <i class="fa-regular fa-comments" style="font-size: 48px; margin-bottom: 15px; color: #ccc;"></i>
                  <h3>No Chat Selected</h3>
                  <p>Choose a customer from the contact list to start messaging.</p>
              </div>
          </div>

      </div>

      </div>

  </main>

  {% include "partials/footer_vendor.html" %}

  <script src="{{ url_for('static', filename='js/vendor/messages.js') }}"></script>
  <script src="{{ url_for('static', filename='js/vendor/vendor_script.js') }}"></script>
</body>
</html>
