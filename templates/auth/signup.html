<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up & Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/signup_style.css', v='1.3') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="position:fixed;top:10px;right:10px;z-index:9999;">
        {% for category, message in messages %}
          <p style="padding:10px 16px;margin:6px;border-radius:6px;background:#333;color:#fff;">{{ message }}</p>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="container">
        <div class="form-box login">
            <form method="POST" action="{{ url_for('signup') }}">
                <input type="hidden" name="action" value="login" />
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required />
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required />
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn submit-btn">Login</button>
            </form>
        </div>

        <div class="form-box register">
            <form method="POST" action="{{ url_for('signup') }}">
                <input type="hidden" name="action" value="register" />
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" name="address" placeholder="Address" required />
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="input-box">
                    <input type="text" name="username" placeholder="Username" required />
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required />
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="tel" name="contact" placeholder="Contact" required />
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="input-box">
                    <select name="gender" required>
                        <option value="" disabled selected>Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                    <i class="fa-solid fa-venus-mars"></i>
                </div>
                <div class="input-box">
                    <input type="number" name="age" placeholder="Age" required />
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required />
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required />
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn submit-btn">Register</button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button type="button" class="btn-toggle register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button type="button" class="btn-toggle login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/user/sigup_script.js') }}"></script>
</body>
</html>
