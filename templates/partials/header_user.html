<!-- Header -->
      <link rel="stylesheet" href="{{ url_for('static', filename='css/user/header.css') }}">
<header class="navbar">
        <div class="logo">
          make
          <img
            src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEidvekcxWaVkfJFq89IxgFYyrdwvk85jeyU-wZ1qDwYIyH3048fsmL_qB0su74UD_3Vk4Hz9rNBa0R2wh72H7rWTtHbdPZGxlXH5RKAe-NZx95eBnhkqeTkyZDyyw8mGRNyCIQ6nJUgyLNfRVpYY5BCtsWj1jjUa8H_T_th4s34RS1JjeBifNBnKuFh6Ww/s320/Screenshot%202026-03-27%20115604.png"
            alt=""
            class="image"
          />
          event
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search events or Services..." />
        </div>

        <nav>
          <a href="{{ url_for('user_home') }}" class="option">Home</a>
          <a href="{{ url_for('user_services') }}" class="option">Services</a>
          <a href="{{ url_for('user_gallery') }}" class="option">Gallery</a>
          <a href="{{ url_for('user_about') }}" class="option">About</a>
          <a href="{{ url_for('user_messages') }}" class="option">Messages</a>
        </nav>

        <div class="icon-btn" onclick="openWishlistModal()">
      ❤️
      <span>Wishlist <span id="wishlist-count" style="display:none;"></span></span>
    </div>
    
    <!-- Notification Bell -->
    <div class="icon-btn" onclick="toggleNotificationDropdown(event)" style="position: relative; margin-right: 15px; cursor: pointer; user-select: none;">
        🔔 <span style="font-weight: 500;">Notifications <span id="notification-badge" style="display: none; background: #ef4444; color: white; border-radius: 50%; padding: 1px 6px; font-size: 10px; font-weight: bold; margin-left: 2px;"></span></span>
        
        <!-- Notification Dropdown -->
        <div id="notificationDropdown" class="user-dropdown" style="display: none; width: 320px; padding: 10px 0; right: 0; top: 40px; text-align: left; max-height: 400px; overflow: hidden; flex-direction: column;">
            <div style="padding: 5px 15px 10px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600; font-size: 14px; color: #1e293b;">Recent Alerts</span>
                <span onclick="markNotificationsAsRead(event)" style="font-size: 12px; color: #2196f3; cursor: pointer; font-weight: normal;">Mark all read</span>
            </div>
            <div id="notificationDropdownList" style="max-height: 280px; overflow-y: auto; padding: 5px 0;">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>
  <div class="user-menu">
    <div class="user-btn" onclick="toggleUserMenu()">
      <img src="{{ session.profile_image or url_for('static', filename='images/default_avatar.svg') }}" alt="User Avatar" class="avatar" />
      <span>{{ session.username or 'Guest' }}</span> &#9660;
    </div>

    <div id="userDropdown" class="user-dropdown">
      <a href="{{ url_for('user_profile') }}"><p>👤 My Profile</p></a>
      <a href="{{ url_for('change_password') }}"><p>🔑 Change Password</p></a>
      <p onclick="logout()">⏻ Logout</p>
    </div>
  </div>
      </header>
